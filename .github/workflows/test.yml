name: Test

on:
  push:
    branches:
      - main
      - 'spike/**'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  spec-check:
    name: Spec check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Generated files match the spec and the lock
        run: python3 spec/specc.py check
      - name: Tool tests
        run: python3 -m unittest discover -s spec/tests -t spec

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - java
          - python
          - csharp
    steps:
      - name: Common - Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Java - Set up JDK
        if: matrix.language == 'java'
        uses: actions/setup-java@v6
        with:
          java-version: "8"
          distribution: "temurin"
      - name: Java - Install jbang
        if: matrix.language == 'java'
        uses: jbangdev/setup-jbang@v0.1.1

      - name: Python - Install Poetry
        if: matrix.language == 'python'
        uses: snok/install-poetry@v1
      - name: Python - Add Poetry to PATH
        if: matrix.language == 'python'
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: C# - Setup .NET
        uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 9

      - name: Common - Run Tests for ${{ matrix.language }}
        run: ./tests/test.sh ${{ matrix.language }}
